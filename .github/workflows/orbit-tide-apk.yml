name: Build and verify Orbit Tide APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-tide-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - name: Check out Orbit Tide
        uses: actions/checkout@v4

      - name: Restore exact dependency lock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, json
          chunks = sorted(Path('.build/lock').glob('*.b64'))
          assert chunks, 'Dependency lock missing'
          lock = json.loads(gzip.decompress(base64.b64decode(''.join(p.read_text() for p in chunks))))
          version = json.loads(Path('package.json').read_text())['version']
          lock['version'] = lock['packages']['']['version'] = version
          Path('package-lock.json').write_text(json.dumps(lock, indent=2) + '\n')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: orbit-tide-gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            orbit-tide-gradle-${{ runner.os }}-

      - name: Install Android SDK components
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install exact app dependencies and test game
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm run typecheck
          npm test

      - name: Generate original logo and stereo audio
        run: |
          python3 -m venv .build/asset-env
          .build/asset-env/bin/pip install numpy==2.3.5 fonttools==4.61.1
          npm install --prefix .build/asset-tools --no-audit --no-fund sharp@0.35.5
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          .build/asset-env/bin/python scripts/create_branding.py
          NODE_PATH="$PWD/.build/asset-tools/node_modules" node scripts/render_branding.cjs
          .build/asset-env/bin/python scripts/generate_audio.py

      - name: Test responsive 3D menu and new mechanics in Chromium
        run: |
          npm install --prefix .build/web-tools --no-audit --no-fund playwright@1.62.1
          node .build/web-tools/node_modules/playwright/cli.js install chromium --only-shell --with-deps
          npx expo export --platform web --output-dir .build/web-dist
          python3 -m http.server 8081 --bind 127.0.0.1 --directory .build/web-dist > .build/web-server.log 2>&1 &
          orbit_web_pid=$!
          trap 'kill "$orbit_web_pid"' EXIT
          NODE_PATH="$PWD/.build/web-tools/node_modules" node scripts/web_smoke.cjs

      - name: Preserve browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-tide-1.3.0-web-test
          path: .build/web-evidence/
          retention-days: 14

      - name: Generate standalone Android project
        run: |
          npx expo prebuild --platform android --no-install
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/gradle.properties')
          assert 'expo.useLegacyPackaging=true' in p.read_text(), 'Native library extraction must be enabled'
          settings = p.read_text().replace('org.gradle.parallel=true', 'org.gradle.parallel=false')
          settings += '\nkotlin.compiler.execution.strategy=in-process\n'
          p.write_text(settings)
          PY

      - name: Build signed release APK with embedded game
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a

      - name: Verify APK, embedded game and signature
        run: |
          mkdir -p delivery
          cp android/app/build/outputs/apk/release/app-release.apk delivery/Orbit-Tide-1.3.0.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose delivery/Orbit-Tide-1.3.0.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging delivery/Orbit-Tide-1.3.0.apk > delivery/apk-info.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, zipfile
          apk = Path('delivery/Orbit-Tide-1.3.0.apk')
          with zipfile.ZipFile(apk) as archive:
              names = archive.namelist()
              assert archive.testzip() is None
              assert 'assets/index.android.bundle' in names, 'Game JavaScript bundle missing'
              for library in ['libreactnative.so', 'libhermesvm.so', 'libexpo-gl.so', 'libexpo-modules-core.so', 'libc++_shared.so', 'libappmodules.so', 'libjsi.so', 'libfbjni.so']:
                  path = 'lib/arm64-v8a/' + library
                  assert path in names, 'Required native library missing: ' + library
                  assert archive.getinfo(path).compress_type == zipfile.ZIP_DEFLATED, 'Native libraries must be extracted at install time'
              assert not any(n.startswith('lib/x86') or n.startswith('lib/armeabi-v7a') for n in names)
          info = Path('delivery/apk-info.txt').read_text()
          assert "name='com.ulasugurlu.orbittide'" in info
          assert "versionName='1.3.0'" in info
          assert 'application-debuggable' not in info
          assert "versionCode='3'" in info
          source_map = json.loads(Path('android/app/build/intermediates/sourcemaps/react/release/index.android.bundle.packager.map').read_text())
          sources = source_map['sources']
          assert any(s.endswith('/three/build/three.module.js') for s in sources), 'Three ESM entry missing'
          assert not any(s.endswith('/three/build/three.cjs') for s in sources), 'Node-only Three entry would crash Hermes'
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          Path('delivery/sha256.txt').write_text(digest + '  ' + apk.name + '\n')
          Path('delivery/build-info.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'], 'version':'1.3.0', 'architecture':'arm64-v8a', 'variant':'release', 'sha256':digest}, indent=2))
          print('Signed release APK verified; game code is embedded.')
          PY

      - name: Upload installable Orbit Tide APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-tide-1.3.0-apk
          path: delivery/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download previous version for upgrade verification
        run: |
          mkdir -p previous
          curl --fail --location --retry 2 --output previous/Orbit-Tide-1.2.1.apk https://github.com/UlasUgurlu/Oyun2/releases/download/v1.2.1/Orbit-Tide-1.2.1.apk
          echo 'cd2a82c7a54fee975cd1f1be5368240e96a9cf613c34adf581a79f37734b3100  previous/Orbit-Tide-1.2.1.apk' | sha256sum -c

      - name: Test release APK on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python scripts/android_smoke.py delivery/Orbit-Tide-1.3.0.apk previous/Orbit-Tide-1.2.1.apk

      - name: Preserve Android test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-tide-1.3.0-android-test
          path: smoke-evidence/
          retention-days: 14


