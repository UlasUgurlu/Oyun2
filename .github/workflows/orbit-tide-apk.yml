name: Build Orbit Tide APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbit-tide-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - name: Check out Orbit Tide
        uses: actions/checkout@v4

      - name: Restore exact dependency lock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          chunks = sorted(Path('.build/lock').glob('*.b64'))
          assert chunks, 'Dependency lock missing'
          Path('package-lock.json').write_bytes(gzip.decompress(base64.b64decode(''.join(p.read_text() for p in chunks))))
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: orbit-tide-gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            orbit-tide-gradle-${{ runner.os }}-

      - name: Install Android SDK components
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install exact app dependencies and test game
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test

      - name: Generate original logo and stereo audio
        run: |
          python3 -m venv .build/asset-env
          .build/asset-env/bin/pip install numpy==2.3.5 fonttools==4.61.1
          npm install --prefix .build/asset-tools --no-audit --no-fund sharp@0.35.5
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          .build/asset-env/bin/python scripts/create_branding.py
          NODE_PATH="$PWD/.build/asset-tools/node_modules" node scripts/render_branding.cjs
          .build/asset-env/bin/python scripts/generate_audio.py

      - name: Generate standalone Android project
        run: |
          npx expo prebuild --platform android --no-install
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/gradle.properties')
          settings = p.read_text().replace('org.gradle.parallel=true', 'org.gradle.parallel=false')
          settings += '\nkotlin.compiler.execution.strategy=in-process\n'
          p.write_text(settings)
          PY

      - name: Build signed release APK with embedded game
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a

      - name: Verify APK, embedded game and signature
        run: |
          mkdir -p delivery
          cp android/app/build/outputs/apk/release/app-release.apk delivery/Orbit-Tide-1.2.0.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose delivery/Orbit-Tide-1.2.0.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging delivery/Orbit-Tide-1.2.0.apk > delivery/apk-info.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, zipfile
          apk = Path('delivery/Orbit-Tide-1.2.0.apk')
          with zipfile.ZipFile(apk) as archive:
              names = archive.namelist()
              assert archive.testzip() is None
              assert 'assets/index.android.bundle' in names, 'Game JavaScript bundle missing'
              assert any(n.startswith('lib/arm64-v8a/') for n in names), 'ARM64 native libraries missing'
              assert not any(n.startswith('lib/x86') or n.startswith('lib/armeabi-v7a') for n in names)
          info = Path('delivery/apk-info.txt').read_text()
          assert "name='com.ulasugurlu.orbittide'" in info
          assert "versionName='1.2.0'" in info
          assert 'application-debuggable' not in info
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          Path('delivery/sha256.txt').write_text(digest + '  ' + apk.name + '\n')
          Path('delivery/build-info.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'], 'version':'1.2.0', 'architecture':'arm64-v8a', 'variant':'release', 'sha256':digest}, indent=2))
          print('Signed release APK verified; game code is embedded.')
          PY

      - name: Upload installable Orbit Tide APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-tide-apk
          path: delivery/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
