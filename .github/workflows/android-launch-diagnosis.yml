name: Diagnose Android launch
on:
  push:
    branches: [android-launch-diagnosis]
    paths: [.github/workflows/android-launch-diagnosis.yml]
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get the APK delivered to the phone
        uses: actions/download-artifact@v4
        with:
          name: orbit-tide-apk
          path: delivery
          run-id: 38587700847
          github-token: ${{ github.token }}
      - name: Diagnose extracted native library packaging
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
          python - <<'PY'
          import struct, zipfile
          from pathlib import Path
          source = Path('delivery/Orbit-Tide-1.2.0.apk')
          with zipfile.ZipFile(source) as old:
              manifest = bytearray(old.read('AndroidManifest.xml'))
              resources = []
              offset, changed = 8, 0
              while offset < len(manifest):
                  kind, header, size = struct.unpack_from('<HHI', manifest, offset)
                  if kind == 0x180:
                      resources = list(struct.unpack_from('<' + 'I' * ((size-header)//4), manifest, offset+header))
                  elif kind == 0x102:
                      start, width, count = struct.unpack_from('<HHH', manifest, offset+24)
                      for i in range(count):
                          pos = offset+16+start+i*width
                          index = struct.unpack_from('<I', manifest, pos+4)[0]
                          if index < len(resources) and resources[index] == 0x010104ea:
                              assert manifest[pos+15] == 0x12
                              struct.pack_into('<I', manifest, pos+16, 0xffffffff)
                              changed += 1
                  offset += size
              assert changed == 1
              with zipfile.ZipFile('delivery/extracted-unsigned.apk', 'w') as new:
                  for entry in old.infolist():
                      if entry.filename.startswith('META-INF/'):
                          continue
                      data = bytes(manifest) if entry.filename == 'AndroidManifest.xml' else old.read(entry)
                      if entry.filename.endswith('.so'):
                          entry.compress_type = zipfile.ZIP_DEFLATED
                      new.writestr(entry, data)
          PY
          keytool -genkeypair -keystore diagnosis.keystore -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -validity 10000
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -f 4 delivery/extracted-unsigned.apk delivery/extracted-aligned.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign --ks diagnosis.keystore --ks-pass pass:android --key-pass pass:android --out delivery/Orbit-Tide-1.2.0.apk delivery/extracted-aligned.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify delivery/Orbit-Tide-1.2.0.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write launch probe
        run: |
          mkdir -p diagnosis
          cat > diagnose.py <<'PY'
          import subprocess, time
          from pathlib import Path
          def adb(*args, check=False):
              p = subprocess.run(['adb', *args], text=True, capture_output=True, timeout=90)
              output = p.stdout + p.stderr
              print(output, flush=True)
              if check and p.returncode:
                  raise RuntimeError('ADB command failed: ' + ' '.join(args))
              return output
          try:
              adb('shell', 'getprop', 'ro.product.cpu.abilist')
              adb('install', '-r', 'delivery/Orbit-Tide-1.2.0.apk', check=True)
              adb('logcat', '-c')
              adb('shell', 'am', 'start', '-W', '-n', 'com.ulasugurlu.orbittide/.MainActivity')
              time.sleep(20)
              pid = adb('shell', 'pidof', 'com.ulasugurlu.orbittide').strip()
              Path('diagnosis/process.txt').write_text(pid)
              adb('shell', 'uiautomator', 'dump', '/sdcard/window.xml')
              adb('pull', '/sdcard/window.xml', 'diagnosis/window.xml')
              image = subprocess.run(['adb', 'exec-out', 'screencap', '-p'], capture_output=True, timeout=30)
              Path('diagnosis/screen.png').write_bytes(image.stdout)
              if not pid:
                  raise RuntimeError('App exited during startup')
          finally:
              p = subprocess.run(['adb', 'logcat', '-d', '-v', 'threadtime'], capture_output=True, text=True, timeout=30)
              Path('diagnosis/logcat.txt').write_text(p.stdout + p.stderr)
              lines = (p.stdout + p.stderr).splitlines()
              for i,line in enumerate(lines):
                  if any(key in line for key in ['FATAL EXCEPTION', 'ReactNativeJS', 'Fatal signal', 'JavascriptException', 'UnsatisfiedLinkError', 'Process: com.ulasugurlu.orbittide']):
                      print('\n'.join(lines[max(0,i-1):i+18]))
          PY
      - name: Run delivered APK on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python diagnose.py
      - name: Preserve Android launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-launch-diagnosis
          path: diagnosis/
          retention-days: 7
